<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f04819">
<title>MMV Field Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=Lato:wght@400;700&display=swap">
<style>
:root{--band:#f04819;--paper:#f5f7f9;--card:#fff;--ink:#020a1d;--muted:#566074;--line:#e0e4ea;--bad:#b0321f}
@media (prefers-color-scheme:dark){:root{--band:#c93a10;--paper:#020a1d;--card:#0b1630;--ink:#eef1f6;--muted:#9ba6b8;--line:#1e2a45;--bad:#f39a8c;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font:16px/1.5 Lato,"Segoe UI",system-ui,sans-serif}
.band{background:var(--band);color:#fff;padding:36px max(16px,env(safe-area-inset-right,0px)) 30px max(16px,env(safe-area-inset-left,0px));padding-top:calc(36px + env(safe-area-inset-top,0px))}
.in{max-width:420px;margin:0 auto}
.logo{font:800 .85rem/0.95 Outfit,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.02em}.logo b{display:block;font-size:1.5rem}
h1{font:800 2.4rem/1 Outfit,system-ui,sans-serif;margin:18px 0 6px;letter-spacing:-.01em}
.wrap{padding:24px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px}
label{display:grid;gap:5px;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
input[type=text],input[type=password]{font:inherit;font-size:1rem;text-transform:none;letter-spacing:0;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:11px 12px;width:100%}
.rem{display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:.92rem;color:var(--ink);font-weight:400}
.rem input{width:18px;height:18px;accent-color:#f04819}
button{font:700 1rem Lato,system-ui,sans-serif;background:#f04819;color:#fff;border:0;border-radius:10px;padding:13px}
button:disabled{opacity:.6}
input:focus-visible,button:focus-visible{outline:2px solid #f04819;outline-offset:2px}
.err{color:var(--bad);font-size:.92rem;min-height:1.3em;margin:0}
</style></head>
<body>
<div class="band"><div class="in"><div class="logo">Thomas<b>More</b></div><h1>MMV Field Kit</h1><div>Maasmechelen Village visit · team only</div></div></div>
<div class="wrap"><div class="in">
<form id="f" autocomplete="on">
<label>Username<input type="text" id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
<label>Password<input type="password" id="p" name="password" autocomplete="current-password" required></label>
<label class="rem"><input type="checkbox" id="r" checked> Remember me on this phone</label>
<button id="b" type="submit">Open the kit</button>
<p class="err" id="e" role="alert"></p>
</form></div></div>
